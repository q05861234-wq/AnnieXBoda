# اسم التطبيق
app = "anniexboda-ma1e5q"
primary_region = "iad"

[processes]
  # أمر التشغيل
  app = "python3 runner.py"

[[vm]]
  # التغيير الجوهري هنا:
  # حولناه من shared لـ performance عشان يقبل كورات عالية
  cpu_kind = "performance"
  
  # عدد الكورات (متاح: 1, 2, 4, 8, 16)
  # انت طلبت 16 (وده وحش كاسر)
  cpus = 16
  
  # الرامات بالميجابايت
  # 50 جيجا = 51200 ميجا (تقريباً)
  # ملحوظة: لازم الرامات تكون متوافقة مع الكورات
  memory_mb = 49152 
